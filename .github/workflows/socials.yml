name: socials
# X through twitterapi.io costs ~$0.00015 per tweet returned (20 per account per run), so this runs four times a day;
# Truth Social (keyless mirror) is also refreshed hourly by the reddit workflow.
on:
  schedule:
    - cron: "25 1,7,13,19 * * *"
  workflow_dispatch:
concurrency:
  group: moonape-data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -e .
      - name: collect socials
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
        run: moonape collect socials
      - if: always()  # commit whatever succeeded even when a collector failed
        run: .github/workflows/_commit.sh "socials $(date -u +%Y-%m-%dT%H:%M)"
  pages:
    needs: collect
    if: always()   # partial results are committed even when a collector failed, so always republish
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
