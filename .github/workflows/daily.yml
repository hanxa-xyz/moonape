name: daily
# 22:45 UTC weekdays (after the Treasury 4pm ET close print and the 6pm ET FINRA file in EDT; FINRA for EST days lands next run).
on:
  schedule:
    - cron: "45 22 * * 1-5"
  workflow_dispatch:
    inputs:
      backfill:
        description: "also run the history backfill"
        type: boolean
        default: false
concurrency:
  group: moonape-data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -e .
      - name: collect daily
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: moonape collect daily
      - name: backfill (manual)
        if: ${{ inputs.backfill }}
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: moonape backfill && moonape site
      - if: always()  # commit whatever succeeded even when a collector failed
        run: .github/workflows/_commit.sh "daily $(date -u +%Y-%m-%d)"
