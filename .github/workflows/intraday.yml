name: intraday
# Every 30 min across 13:00–21:59 UTC on weekdays: covers 9:30–16:00 ET in both EDT and EST.
# The collector asks Alpaca's calendar first and exits quietly outside the session window.
on:
  schedule:
    - cron: "7,37 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "collect even if the market is closed"
        type: boolean
        default: false
concurrency:
  group: moonape-data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -e .
      - name: collect intraday
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: moonape collect intraday ${{ inputs.force && '--force' || '' }}
      - run: .github/workflows/_commit.sh "intraday $(date -u +%Y-%m-%dT%H:%M)"
