name: pages
# Builds site/data/*.json from data/ and deploys site/ to GitHub Pages. Called by every collector after it commits
# (pushes made with GITHUB_TOKEN never trigger other workflows), and on human pushes that touch site/ or the builder.
on:
  workflow_call:
  push:
    branches: [main]
    paths: ["site/**", "src/moonape/build_site.py", "library/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: moonape-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # the branch tip, which includes the commit the calling collector just pushed
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -e .
      - name: build site data from data/
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}   # only read to label whether X is enabled
        run: moonape site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
