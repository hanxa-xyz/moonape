[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moonape"
version = "0.1.0"
description = "GME study tracker: Alpaca options chain, max pain, IV views, Superstonk DD, SEC filings, yields and yen"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "pandas>=2.1",
  "pyarrow>=14",
  "duckdb>=1.0",
  "python-dotenv>=1.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
moonape = "moonape.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
